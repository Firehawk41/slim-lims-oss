[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "slim-lims"
version = "0.1.0"
description = "SLIM LIMS (OSS demo): sample submission, analytical results, reports and the lab board"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.1",
    "bcrypt>=4.1",
    "pydantic[email]>=2.6,<3.0",
    "python-dotenv>=1.0",
    "psycopg2-binary>=2.9",
    "tzdata",  # zoneinfo data for LAB_TIMEZONE on slim container images
    # Analytical results module (D-70). Not on PyPI; co-developing: pip install -e ../slim-data-oss
    "slim-data @ git+https://github.com/Firehawk41/slim-data-oss@main",
    # slim-domain: its hash-chained audit log over the shared database (slim-data D-77), and the bridge.
    "slim-domain @ git+https://github.com/Firehawk41/slim-domain-oss@main",
    # Invoicing V5 (slim-data D-83): a subfolder of the invoicing repo. Co-developing: pip install -e ../SLIM-Invoicing-Program/V5-LIMS-Module
    "slim-invoicing @ git+https://github.com/Firehawk41/SLIM-Invoicing-Program@main#subdirectory=V5-LIMS-Module",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff==0.16.9"]
# The demo seed (scripts/seed_demo.py) also needs slim-report-engine-oss, installed from a local
# checkout: pip install -e ../slim-report-engine-oss

[tool.setuptools.packages.find]
include = ["slim_lims*"]

[tool.setuptools.package-data]
slim_lims = ["templates/**/*", "static/**/*", "migrations/**/*", "alembic.ini", "data/*.csv"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["docs", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# These import test_demo_scenarios' fixtures, which their tests then take as arguments.
"tests/test_board.py" = ["F811"]
"tests/test_invoicing.py" = ["F811"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.exclude-package-data]
"*" = ["*.pyc", "__pycache__/*"]
