[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "slim-lims"
version = "0.1.0"
description = "SLIM LIMS (OSS demo): sample submission, analytical results, reports and the lab board"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.1",
    "bcrypt>=4.1",
    "pydantic[email]>=2.6,<3.0",
    "python-dotenv>=1.0",
    "psycopg2-binary>=2.9",
    "tzdata",  # zoneinfo data for LAB_TIMEZONE on slim container images
    # Every SLIM module is pinned to a merged commit (slim-data D-117): a module's main moving never
    # changes what this app runs. Bump a pin in a host PR, with the CI workflow and render.yaml
    # (tests/test_pins.py checks they agree).
    # Analytical results module (D-70). Not on PyPI; co-developing: pip install -e ../slim-data-oss
    "slim-data @ git+https://github.com/Firehawk41/slim-data-oss@89c98aba78901ef8f01de686d2e42d308f004d67",
    # The prep book (slim-prep P6). Co-developing: pip install -e ../slim-prep-oss
    "slim-prep @ git+https://github.com/Firehawk41/slim-prep-oss@68979e828cba23fc26daf3132ce3c67fbdaa94fc",
    # The sample module (slim-samples S-01). Co-developing: pip install -e ../slim-samples-oss
    "slim-samples @ git+https://github.com/Firehawk41/slim-samples-oss@fc1be70ce8dbaa1f70c8d31185f760c3557dc5e7",
    # The quality module (slim-data D-109). Co-developing: pip install -e ../slim-quality-oss
    "slim-quality @ git+https://github.com/Firehawk41/slim-quality-oss@abf9ed5a0923d80aa1ae6ec1bcd94c5099770eb2",
    # slim-domain: its hash-chained audit log over the shared database (slim-data D-77), and the bridge.
    "slim-domain @ git+https://github.com/Firehawk41/slim-domain-oss@7b97dada57eb27440a4d63be4263d84263c1647d",
    # Invoicing V5 (slim-data D-83): a subfolder of the invoicing repo. Co-developing: pip install -e ../SLIM-Invoicing-Program/V5-LIMS-Module
    "slim-invoicing @ git+https://github.com/Firehawk41/SLIM-Invoicing-Program@95de40153620d4f23676167eb28cb0286475bcef#subdirectory=V5-LIMS-Module",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff==0.16.9"]
# The demo seed (scripts/seed_demo.py) also needs slim-report-engine-oss, installed from a local
# checkout: pip install -e ../slim-report-engine-oss

[tool.setuptools.packages.find]
include = ["slim_lims*"]

[tool.setuptools.package-data]
slim_lims = ["templates/**/*", "static/**/*", "migrations/**/*", "alembic.ini", "data/*.csv"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["docs", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# These import test_demo_scenarios' fixtures, which their tests then take as arguments.
"tests/test_board.py" = ["F811"]
"tests/test_invoicing.py" = ["F811"]
"tests/test_samples.py" = ["F811"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.exclude-package-data]
"*" = ["*.pyc", "__pycache__/*"]
