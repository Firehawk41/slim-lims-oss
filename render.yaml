# The public demo on Render (free plan): Postgres + slim-lims-oss, seeded with the OSS demo data.
# OSS ONLY: PORTAL_ALLOWED_DB_HOSTS is set to this blueprint's own demo database host, nothing else
# (see slim_lims/oss_guard.py). The service is slim-lims-oss (slim-lims-oss.onrender.com); the database
# is slim-lims-db. Renaming the database later makes Render create a second one (the free plan allows
# one): delete the old database first.
databases:
  - name: slim-lims-db
    plan: free
    databaseName: slim_lims
    user: slim_lims

services:
  - type: web
    name: slim-lims-oss
    runtime: python
    plan: free
    # The demo seed loads SLIM's fictional reference data from slim-report-engine-oss's demo/demo.py.
    buildCommand: >-
      rm -rf vendor && git clone --depth 1 https://github.com/Firehawk41/slim-report-engine-oss vendor/slim-report-engine-oss
      && pip install . "slim-domain @ git+https://github.com/Firehawk41/slim-domain-oss@main" ./vendor/slim-report-engine-oss
    # The seed runs every migration and installs the audit log; re-running it changes nothing
    # (SLIM data, ruleset, personas and scenarios are each skipped once present).
    # Demo labs (slim-data D-102): public keeps no app tables (emptied once, the first start after the
    # switch); the shared lab is DATABASE_SCHEMA; each visitor gets a lab of their own.
    startCommand: >-
      python -m slim_lims.cli empty-public --yes --if-needed
      && python scripts/seed_demo.py --oss-report-engine vendor/slim-report-engine-oss
      && uvicorn --factory slim_lims.main:create_app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.15"
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: slim-lims-db
          property: connectionString
      - key: PORTAL_ALLOWED_DB_HOSTS
        fromDatabase:
          name: slim-lims-db
          property: host
      - key: DEMO_PERSONAS
        value: "true"
      - key: DEMO_LABS
        value: "true"
      - key: DATABASE_SCHEMA
        value: lab_shared
      - key: SLIM_REPORT_ENGINE_OSS_DIR
        value: vendor/slim-report-engine-oss
