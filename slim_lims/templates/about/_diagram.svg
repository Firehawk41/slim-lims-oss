{#- The architecture by department (roadmap: labels only, not code). Plain SVG: no script, no inline style. -#}
{%- macro box(x, y, name, sub, kind="") -%}
  <g class="arch-box {{ kind }}">
    <rect x="{{ x }}" y="{{ y }}" width="225" height="58" rx="6"/>
    <text x="{{ x + 12 }}" y="{{ y + 24 }}" class="arch-name">{{ name }}</text>
    <text x="{{ x + 12 }}" y="{{ y + 44 }}" class="arch-sub">{{ sub }}</text>
  </g>
{%- endmacro -%}
<div class="arch-scroll"><svg class="arch" viewBox="0 0 960 410" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">SlimLIMS architecture by department</title>
  <desc id="arch-desc">The host app composes independent module libraries, grouped as Admin, Lab, Quality
    and IT; each module keeps its own tables in one shared database.</desc>
  <g class="arch-box arch-host">
    <rect x="0" y="0" width="960" height="62" rx="6"/>
    <text x="480" y="26" class="arch-name" text-anchor="middle">slim-lims-oss · the host</text>
    <text x="480" y="47" class="arch-sub" text-anchor="middle">screens, logins, a lab per visitor; composes the modules, owns the transaction</text>
  </g>
  {% for x, dept in ((0, "Admin"), (245, "Lab"), (490, "Quality"), (735, "IT")) %}
    <text x="{{ x + 112 }}" y="100" class="arch-dept" text-anchor="middle">{{ dept }}</text>
    <line x1="{{ x + 112 }}" y1="62" x2="{{ x + 112 }}" y2="84" class="arch-link"/>
  {% endfor %}
  {{ box(0, 116, "Requests", "host screens, customers") }}
  {{ box(0, 186, "slim_invoicing", "invoicing V5") }}
  {{ box(0, 256, "slim-report-engine", "report template") }}
  {{ box(245, 116, "slim-prep", "the prep book") }}
  {{ box(245, 186, "slim-data", "readers, rules engine") }}
  {{ box(245, 256, "slim-data", "review, release, reports") }}
  {{ box(490, 116, "Audit log", "slim-domain") }}
  {{ box(490, 186, "verify", "slim-data replays results") }}
  {{ box(490, 256, "slim-quality", "planned: QC charts", "arch-planned") }}
  {{ box(735, 116, "slim-domain", "reference data") }}
  {{ box(735, 186, "Host", "logins, labs, CSRF, CSP") }}
  <g class="arch-box arch-db">
    <rect x="0" y="336" width="960" height="70" rx="6"/>
    <text x="480" y="364" class="arch-name" text-anchor="middle">One database (Postgres 16 or SQLite)</text>
    <text x="480" y="386" class="arch-sub" text-anchor="middle">each module its own tables and Alembic version table; no foreign keys between modules</text>
  </g>
</svg></div>
